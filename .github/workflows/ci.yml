name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  srccam-smoke:
    name: Install srccam + smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip
          # локальная установка библиотеки курса + зависимости для CI без GUI
          pip install ./srccam
          pip install pytest "numpy>=1.24" "opencv-python-headless>=3.4" "pyyaml>=6.0"

      - name: Run smoke tests
        run: python -m pytest tests/test_srccam_smoke.py -q
